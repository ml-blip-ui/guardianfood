# Keeps data/recipes.json — the app's own searchable index — up to date.
#
# The scheduled run reads only the newest few pages, which is all it takes: new
# recipes appear at the front of /tone/recipes, and rows are merged by path so
# a top-up adds what is new without touching what is already there.
#
# To rebuild from scratch, or to fill in images after a parser change, run this
# by hand from the Actions tab with pages set to "all".
#
# Each run that finds anything commits, and that commit is what rebuilds the
# site — so how often this fires is also how often the host is asked to build.

name: Refresh the recipe index

on:
  schedule:
    # The 1st and 21st, 06:00 UTC — roughly every 20 days, which is as close as
    # cron gets: it counts days within a month and cannot express an interval
    # that runs across the boundary. So the gaps alternate, 20 days then 10 or
    # 11, rather than being even. That is about 24 runs a year in place of 52.
    - cron: "0 6 1,21 * *"
  workflow_dispatch:
    inputs:
      pages:
        description: 'How many pages to read, or "all" for the whole archive.'
        required: false
        default: "3"

permissions:
  contents: write

# Never let two crawls write the same file at once.
concurrency:
  group: recipe-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.6+ runs the TypeScript crawler directly. The crawler has no
          # dependencies, so there is nothing to install.
          node-version: "22"

      - name: Read the Guardian
        env:
          # Through the environment rather than inlined into the command, so a
          # workflow input cannot become part of the shell line.
          PAGES: ${{ github.event.inputs.pages }}
        run: |
          set -euo pipefail
          pages="${PAGES:-}"
          if [ "$pages" = "all" ]; then
            npm run crawl
          elif [ -z "$pages" ]; then
            # The Guardian publishes around two or three recipes a day, so a
            # 20-day gap leaves roughly 50 to collect — two and a half pages.
            # Six is headroom for a busy spell like Christmas, and costs six
            # requests rather than three.
            npm run crawl -- 6
          elif printf '%s' "$pages" | grep -qE '^[0-9]{1,4}$'; then
            npm run crawl -- "$pages"
          else
            echo "pages must be a number or \"all\", got: $pages" >&2
            exit 1
          fi

      - name: Commit any change
        run: |
          set -euo pipefail
          if git diff --quiet -- data/recipes.json; then
            echo "The index is already current. Nothing to commit."
            exit 0
          fi
          count=$(node -e 'process.stdout.write(String(require("./data/recipes.json").count))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git commit -m "Refresh the recipe index ($count recipes)"
          git push
