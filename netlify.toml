[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# No [[headers]] rule for the API routes. A path-scoped Cache-Control here was
# once applied to /api/feed while the shelf travelled in a query string, so the
# edge cached one shelf's articles and served them for every shelf. The routes
# set their own Cache-Control, and each shelf now has its own path.
